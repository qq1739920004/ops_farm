name: Code Analysis & Daily Report

on:
  push:
    branches:
      - vb

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Debug - Check Token
        run: |
          echo "Checking token configuration..."
          if [ -z "${{ secrets.COZE_API_TOKEN }}" ]; then
            echo "❌ ERROR: COZE_API_TOKEN is empty or not set!"
            exit 1
          fi
          
          # 打印 Token 的前 20 个字符（不暴露完整 Token）
          TOKEN="${{ secrets.COZE_API_TOKEN }}"
          echo "Token prefix: ${TOKEN:0:20}..."
          echo "Token length: ${#TOKEN}"
          
          # 检查 Token 是否以 eyJ 开头（JWT 格式）
          if [[ "$TOKEN" == eyJ* ]]; then
            echo "✅ Token format: JWT (correct)"
          else
            echo "⚠️ Token format: Not JWT, may be incorrect"
          fi

      - name: Trigger Coze Workflow
        env:
          COZE_API_TOKEN: ${{ secrets.COZE_API_TOKEN }}
        run: |
          COMMIT_SHA="${{ github.sha }}"
          COMMIT_MESSAGE="${{ github.event.head_commit.message }}"
          COMMIT_AUTHOR="${{ github.event.head_commit.author.name }}"
          REPO_URL="${{ github.event.repository.html_url }}"
          BRANCH="${{ github.ref_name }}"
          
          echo "=========================================="
          echo "🚀 Triggering Coze Workflow"
          echo "=========================================="
          echo "  Repository: $REPO_URL"
          echo "  Branch: $BRANCH"
          echo "  Commit: $COMMIT_SHA"
          echo "  Author: $COMMIT_AUTHOR"
          echo "=========================================="
          
          REQUEST_BODY='{
            "webhook_payload": {
              "repository": {"html_url": "'"$REPO_URL"'"},
              "ref": "refs/heads/'"$BRANCH"'",
              "head_commit": {
                "id": "'"$COMMIT_SHA"'",
                "message": "'"$COMMIT_MESSAGE"'",
                "author": {"name": "'"$COMMIT_AUTHOR"'"}
              },
              "commits": [{
                "id": "'"$COMMIT_SHA"'",
                "message": "'"$COMMIT_MESSAGE"'",
                "author": {"name": "'"$COMMIT_AUTHOR"'"}
              }]
            }
          }'
          
          echo "Request Body:"
          echo "$REQUEST_BODY" | jq . 2>/dev/null || echo "$REQUEST_BODY"
          echo ""
          
          # 打印完整的 curl 命令（隐藏 Token）
          echo "Curl command (token hidden):"
          echo "curl -X POST 'https://bcmnz6k8jx.coze.site/run'"
          echo "  -H 'Content-Type: application/json'"
          echo "  -H 'Authorization: Bearer ***'"
          echo "  -d '<body>'"
          echo ""
          
          # 发送请求并保存完整响应
          echo "Sending request..."
          RESPONSE=$(curl -v -s -w "\n---HTTP_CODE---%{http_code}" \
            --connect-timeout 30 \
            --max-time 120 \
            -X POST "https://bcmnz6k8jx.coze.site/run" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $COZE_API_TOKEN" \
            -d "$REQUEST_BODY" 2>&1)
          
          echo ""
          echo "========== FULL RESPONSE =========="
          echo "$RESPONSE"
          echo "===================================="
          
          # 解析 HTTP 状态码
          HTTP_CODE=$(echo "$RESPONSE" | grep "---HTTP_CODE---" | sed 's/---HTTP_CODE---//')
          BODY=$(echo "$RESPONSE" | sed '/---HTTP_CODE---/d')
          
          echo ""
          echo "HTTP Status Code: $HTTP_CODE"
          echo "Response Body: $BODY"
          
          if [ "$HTTP_CODE" = "200" ]; then
            echo ""
            echo "✅ SUCCESS!"
            exit 0
          fi
          
          # 详细错误分析
          echo ""
          echo "❌ FAILED"
          
          if echo "$BODY" | grep -q "Missing authorization"; then
            echo ""
            echo "Error Type: Missing Authorization Header"
            echo "This means the Authorization header is not being sent correctly."
            echo "Check if the secret name is exactly 'COZE_API_TOKEN'"
          elif echo "$BODY" | grep -q "Authentication failed\|invalid token"; then
            echo ""
            echo "Error Type: Invalid Token"
            echo "The token is being sent but is invalid or expired."
            echo "Please regenerate a new token from Coze platform."
          elif echo "$BODY" | grep -q "no_ready_instance"; then
            echo ""
            echo "Error Type: Service Cold Start"
            echo "The service is starting up. Try again in a few minutes."
          elif [ -z "$HTTP_CODE" ] || [ "$HTTP_CODE" = "000" ]; then
            echo ""
            echo "Error Type: Connection Failed"
            echo "Could not connect to the server or request timed out."
          fi
          
          exit 1
