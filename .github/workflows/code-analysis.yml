name: Code Analysis & Daily Report

on:
  push:
    branches:
      - vb

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Trigger Coze Workflow
        env:
          COZE_API_TOKEN: ${{ secrets.COZE_API_TOKEN }}
        run: |
          COMMIT_SHA="${{ github.sha }}"
          COMMIT_MESSAGE="${{ github.event.head_commit.message }}"
          COMMIT_AUTHOR="${{ github.event.head_commit.author.name }}"
          REPO_URL="${{ github.event.repository.html_url }}"
          BRANCH="${{ github.ref_name }}"

          echo "🚀 Triggering Coze Workflow..."
          echo "  Repository: $REPO_URL"
          echo "  Branch: $BRANCH"
          echo "  Commit: $COMMIT_SHA"

          REF="refs/heads/$BRANCH"

          REQUEST_BODY=$(jq -n \
            --arg repo_url "$REPO_URL" \
            --arg ref "$REF" \
            --arg commit_sha "$COMMIT_SHA" \
            --arg commit_msg "$COMMIT_MESSAGE" \
            --arg commit_author "$COMMIT_AUTHOR" \
            '{
              "webhook_payload": {
                "repository": {"html_url": $repo_url},
                "ref": $ref,
                "head_commit": {
                  "id": $commit_sha,
                  "message": $commit_msg,
                  "author": {"name": $commit_author}
                },
                "commits": [{
                  "id": $commit_sha,
                  "message": $commit_msg,
                  "author": {"name": $commit_author}
                }]
              }
            }')

          # 预热服务
          echo "🔥 Warming up service..."
          curl -s -m 30 -X POST "https://bcmnz6k8jx.coze.site/run" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $COZE_API_TOKEN" \
            -d "$REQUEST_BODY" > /dev/null 2>&1 || true

          echo "⏳ Waiting 60s for service to start..."
          sleep 60

          # 正式请求
          echo "🚀 Sending actual request..."

          for i in 1 2 3; do
            echo "Attempt $i..."

            RESPONSE=$(curl -s -w "\n%{http_code}" \
              --connect-timeout 30 \
              --max-time 300 \
              -X POST "https://bcmnz6k8jx.coze.site/run" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $COZE_API_TOKEN" \
              -d "$REQUEST_BODY")

            HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
            BODY=$(echo "$RESPONSE" | sed '$d')

            echo "HTTP Status: $HTTP_CODE"

            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Success!"
              echo "$BODY"
              exit 0
            fi

            echo "Response: $BODY"
            [ $i -lt 3 ] && echo "Retrying in 30s..." && sleep 30
          done

          echo "❌ Failed after 3 attempts"
          exit 1
