name: Code Analysis & Daily Report

on:
  push:
    branches:
      - vb

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Trigger Coze Workflow
        env:
          COZE_API_TOKEN: ${{ secrets.COZE_API_TOKEN }}
        run: |
          COMMIT_SHA="${{ github.sha }}"
          COMMIT_MESSAGE="${{ github.event.head_commit.message }}"
          COMMIT_AUTHOR="${{ github.event.head_commit.author.name }}"
          REPO_URL="${{ github.event.repository.html_url }}"
          BRANCH="${{ github.ref_name }}"
          
          echo "🚀 Triggering Coze Workflow..."
          echo "  Repository: $REPO_URL"
          echo "  Branch: $BRANCH"
          echo "  Commit: $COMMIT_SHA"
          
          REQUEST_BODY=$(jq -n \
            --arg repo_url "$REPO_URL" \
            --arg branch "$BRANCH" \
            --arg commit_sha "$COMMIT_SHA" \
            --arg commit_msg "$COMMIT_MESSAGE" \
            --arg commit_author "$COMMIT_AUTHOR" \
            '{
              "webhook_payload": {
                "repository": {"html_url": $repo_url},
                "ref": "refs/heads/" + $branch,
                "head_commit": {
                  "id": $commit_sha,
                  "message": $commit_msg,
                  "author": {"name": $commit_author}
                },
                "commits": [{
                  "id": $commit_sha,
                  "message": $commit_msg,
                  "author": {"name": $commit_author}
                }]
              }
            }')
          
          for i in 1 2 3; do
            echo "Attempt $i..."
            RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "https://bcmnz6k8jx.coze.site/run" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $COZE_API_TOKEN" \
              -d "$REQUEST_BODY")
            
            HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
            BODY=$(echo "$RESPONSE" | sed '$d')
            
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Success!"
              echo "$BODY"
              exit 0
            fi
            
            echo "Response: $BODY"
            sleep 10
          done
          
          echo "❌ Failed after 3 attempts"
          exit 1
